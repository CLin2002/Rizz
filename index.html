<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Quick Question...</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff0f3;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 20px;
            max-width: 400px;
            width: 100%;
        }
        .buttons {
            margin-top: 30px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            height: 100px;
        }
        .identity-buttons {
            flex-direction: column;
            gap: 15px;
            height: auto;
            margin-top: 20px;
        }
        button, input {
            padding: 14px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button {
            touch-action: manipulation;
        }
        .yes-btn {
            background-color: #ff4d6d;
            color: white;
            z-index: 10;
        }
        #noBtn {
            background-color: #adb5bd;
            color: white;
            transition: transform 0.2s ease-out, opacity 0.4s ease; 
        }
        .not-angie-btn {
            background-color: #adb5bd;
            color: white;
            width: 100%;
        }
        
        /* Expanded Meme Image Styling */
        .meme-img {
            max-width: 280px;
            width: 100%;
            height: auto;
            margin-bottom: 15px;
        }

        /* Hidden Screens */
        #questionScreen, #plannerScreen, #deniedScreen {
            display: none;
        }
        
        #identityScreen {
            display: block;
            animation: fadeIn 0.5s ease-in-out forwards;
        }

        .input-group {
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }
        label {
            font-size: 14px;
            color: #d90429;
            font-weight: bold;
        }
        input[type="date"], input[type="time"], input[type="text"] {
            background-color: white;
            border: 1px solid #ffccd5;
            width: 100%;
            box-sizing: border-box;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 8px;
        }
        #submitBtn {
            background-color: #ff4d6d;
            color: white;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND MUSIC -->
    <audio id="bgMusic" loop>
        <source src="assets/One Less Lonely Girl.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- IDENTITY CHECK SCREEN -->
    <div class="container" id="identityScreen">
        <h1>Hold on... who is this? 🧐</h1>
        <div class="buttons identity-buttons">
            <button class="yes-btn" style="width: 100%;" onclick="showQuestion()">It's Angie!</button>
            <button class="not-angie-btn" onclick="showDenied()">Definitely not Angie ❌</button>
        </div>
    </div>

    <!-- DENIED SCREEN (For Not Angie) -->
    <div class="container" id="deniedScreen">
        <img src="assets/huh.gif" alt="Huh Cat" class="meme-img">
        <h1>ACCESS DENIED! 🚨</h1>
        <p>This link is strictly reserved for Angie. Shoo!</p>
    </div>

    <!-- QUESTION SCREEN (Hidden Initially) -->
    <div class="container" id="questionScreen">
        <h1>Will you go out on a date with me?</h1>
        <div class="buttons">
            <button class="yes-btn" onclick="showPlanner()">Yes!</button>
            <!-- Unique ID for the dodging No button -->
            <button id="noBtn" onmouseover="dodge(event)" ontouchstart="dodge(event)" onclick="fadeAway(this)">No</button>
        </div>
    </div>

    <!-- PLANNER SCREEN (Hidden Initially) -->
    <div class="container" id="plannerScreen">
        <img src="assets/thumb.jpg" alt="Yippee!" class="meme-img">
        
        <h1>Yay! Best decision ever.</h1>
        <p>Let's lock down a time and place.</p>
        
        <div class="input-group">
            <label for="datePicker">Pick a Day:</label>
            <input type="date" id="datePicker">
        </div>

        <div class="input-group">
            <label for="timePicker">Pick a Time:</label>
            <input type="time" id="timePicker">
        </div>

        <div class="input-group">
            <label for="ideaInput">What should we do?</label>
            <input type="text" id="ideaInput" placeholder="Dinner, drinks, run a marathon...">
        </div>

        <button id="submitBtn" onclick="sendDetails()">Send Details</button>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const bgMusic = document.getElementById('bgMusic');

        // Attempts to play music on the very first touch/click anywhere on the page
        document.body.addEventListener('click', function playAudioOnce() {
            bgMusic.play().catch(error => {
                console.log("Autoplay blocked/waiting for interaction");
            });
            // Remove listener after first interaction so it doesn't trigger repeatedly
            document.body.removeEventListener('click', playAudioOnce);
        }, { once: true });

        function showQuestion() {
            document.getElementById('identityScreen').style.display = 'none';
            document.getElementById('questionScreen').style.display = 'block';
        }

        function showDenied() {
            document.getElementById('identityScreen').style.display = 'none';
            document.getElementById('deniedScreen').style.display = 'block';
        }

        function dodge(e) {
            const rect = noBtn.getBoundingClientRect();
            const btnX = rect.left + rect.width / 2;
            const btnY = rect.top + rect.height / 2;

            let clientX = e.clientX;
            let clientY = e.clientY;
            
            if (e.type === 'touchstart' && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            const angle = Math.atan2(btnY - clientY, btnX - clientX);
            const pushDistance = 140;

            const moveX = Math.cos(angle) * pushDistance;
            const moveY = Math.sin(angle) * pushDistance;

            noBtn.style.transform = `translate(${moveX}px, ${moveY}px)`;
        }

        function fadeAway(btn) {
            btn.style.opacity = "0";
            setTimeout(() => {
                btn.style.display = "none";
            }, 400);
        }

        function showPlanner() {
            document.getElementById('questionScreen').style.display = 'none';
            document.getElementById('plannerScreen').style.display = 'block';
        }

        function sendDetails() {
            const date = document.getElementById('datePicker').value;
            const time = document.getElementById('timePicker').value;
            const idea = document.getElementById('ideaInput').value;

            if (!date || !time) {
                alert("Please pick at least a date and time so we can plan it out!");
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Sending...";

            const scriptURL = 'https://script.google.com/macros/s/AKfycbygsaIjJN4g7LPo_Qf5ArizryV5VffuyFjmgyxtd3f39fIbfBB-nR0lZ-fW_2pgADsA/exec';

            const form = document.createElement('form');
            form.method = 'POST';
            form.action = scriptURL;
            form.target = 'hiddeniframe';

            const fields = { date: date, time: time, idea: idea };
            for (const key in fields) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = fields[key];
                form.appendChild(input);
            }

            let iframe = document.getElementById('hiddeniframe');
            if (!iframe) {
                iframe = document.createElement('iframe');
                iframe.name = 'hiddeniframe';
                iframe.id = 'hiddeniframe';
                iframe.style.display = 'none';
                document.body.appendChild(iframe);
            }

            document.body.appendChild(form);
            form.submit();

            setTimeout(() => {
                document.getElementById('plannerScreen').innerHTML = `
                    <img src="assets/yipee.gif" alt="Yippee!" class="meme-img">
                    <h1>Got it!</h1>
                    <p>I can't wait. See you then!</p>
                `;
            }, 500);
        }
    </script>
</body>
</html>
